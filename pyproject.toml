[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "leftovers"
version = "0.1.0"
description = "A compiled query executor for graphql-core."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ansar Salken" }]
dependencies = ["graphql-core>=3.3,<3.4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100", "ariadne>=1.1", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/leftovers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["fuzz: Hypothesis differential fuzzing (set LEFTOVERS_FUZZ_EXAMPLES for longer runs)"]

[tool.ruff]
line-length = 120
target-version = "py310"
